[build]
  command   = "jekyll build"
  publish   = "_site"

[build.environment]
  JEKYLL_ENV   = "production"
  RUBY_VERSION = "3.1.0"

# Netlify Identity for CMS login
[[plugins]]
  package = "@netlify/plugin-gatsby"

# Cache Jekyll build for faster deploys
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true

# Redirects
[[redirects]]
  from   = "/admin"
  to     = "/admin/index.html"
  status = 200

[[redirects]]
  from   = "/premium"
  to     = "/academy/"
  status = 301

[[redirects]]
  from   = "/subscribe"
  to     = "/#subscribe"
  status = 301

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-XSS-Protection       = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
