[build]
  command   = "bundle exec jekyll build"
  publish   = "_site"

[build.environment]
  JEKYLL_ENV   = "production"
  RUBY_VERSION = "3.1.0"

[[redirects]]
  from   = "/admin"
  to     = "/admin/index.html"
  status = 200

[[redirects]]
  from   = "/premium"
  to     = "/academy/"
  status = 301

[[redirects]]
  from   = "/subscribe"
  to     = "/#subscribe"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
