title: "Edge Aurum"
tagline: "Intelligence Beyond the Charts"
description: "Geopolitical intelligence decoded for Gold, Forex & Bitcoin traders. Daily news, deep analysis, and premium education."
url: "https://edgeaurum.com"
baseurl: ""
lang: en
timezone: UTC
email: "hello@edgeaurum.com"

# Monetization
gumroad_product_url: "https://gumroad.com/l/YOUR_PRODUCT_ID"
convertkit_form_id: "YOUR_FORM_ID"
convertkit_uid: "YOUR_UID"
telegram_url: "https://t.me/edgeaurum"
twitter_url: "https://x.com/edgeaurum"
google_analytics: "G-NFHJJJKC2V"

# Build
markdown: kramdown
highlighter: rouge
permalink: /:categories/:slug/
future: true
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Collections
collections:
  news:
    output: true
    permalink: /news/:slug/
  analysis:
    output: true
    permalink: /analysis/:slug/

# Defaults
defaults:
  - scope:
      path: ""
      type: news
    values:
      layout: post
      category: news
  - scope:
      path: ""
      type: analysis
    values:
      layout: post
      category: analysis

# Pagination v2
pagination:
  enabled: true
  per_page: 12
  permalink: "/page/:num/"
  title: ":title - Page :num"
  sort_field: date
  sort_reverse: true

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate-v2
  - jekyll-redirect-from
  - jekyll-last-modified-at

# Feed
feed:
  collections:
    news:
      path: feed.xml

# SEO
twitter:
  username: edgeaurum
  card: summary_large_image
social:
  name: Edge Aurum
  links:
    - https://x.com/edgeaurum
    - https://t.me/edgeaurum

# Last Modified At
last-modified-at:
  date-format: "%Y-%m-%d %H:%M:%S"

# Exclude — admin is raw HTML, must not be processed by Jekyll
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - vendor/bundle
  - vendor/cache
  - vendor/gems
  - vendor/ruby
  - admin/config.yml
